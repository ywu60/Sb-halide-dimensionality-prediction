# Pipeline configuration. Relative paths are resolved from data_extraction/.

paths:
  papers_dir: "data/papers"
  data_dir: "data"

llm:
  provider: openai
  model: gpt-4.1-mini
  eligibility_model: gpt-4.1-mini
  registry_model: gpt-4.1-mini
  relevance_model: gpt-4.1-mini
  dossier_model: gpt-4.1
  cation_model: gpt-4.1
  dimensionality_model: gpt-4.1
  verification_model: gpt-4.1
  temperature: 0.0
  max_retries: 3
  timeout_s: 120
  prompt_version: "v1"

retrieval:
  bm25_top_k: 40
  dense_top_k: 40
  neighbor_window: 1
  rerank_top_k: 12
  classification_pool_cap: 30

verification:
  max_retrieval_cycles: 2

parsing:
  min_paragraph_chars: 20
